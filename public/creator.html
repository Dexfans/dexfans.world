<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  >

  <title>Creator | DexFans</title>

  <link
    rel="stylesheet"
    href="/style.css"
  >

</head>

<body>

<header class="nav">

  <a
    class="logo"
    href="/"
  >
    <span class="logo-mark">
      D
    </span>

    DexFans
  </a>

  <button
    class="wallet-button"
    id="connect"
  >
    Connect Wallet
  </button>

</header>


<main>

<section
  class="section"
  id="creator"
>

  <div class="loading">
    Loading creator...
  </div>

</section>

</main>


<script>

const API = "";

let wallet = null;

const params =
  new URLSearchParams(
    window.location.search
  );

const username =
  params.get("username");


async function connect() {

  if (!window.solana) {

    alert(
      "Install Phantom or another Solana wallet."
    );

    return;
  }

  const response =
    await window.solana.connect();

  wallet =
    response.publicKey.toString();

  document.getElementById(
    "connect"
  ).textContent =
    wallet.slice(0,4) +
    "..." +
    wallet.slice(-4);
}


document.getElementById(
  "connect"
).onclick = connect;


async function loadCreator() {

  const root =
    document.getElementById(
      "creator"
    );

  if (!username) {

    root.innerHTML =
      "<h1>Creator not specified.</h1>";

    return;
  }

  const response =
    await fetch(
      `${API}/api/creators/${encodeURIComponent(username)}`
    );

  const data =
    await response.json();

  if (!response.ok) {

    root.innerHTML =
      "<h1>Creator not found.</h1>";

    return;
  }

  const creator =
    data.creator;

  root.innerHTML = `

    <div style="
      max-width:900px;
      margin:auto;
    ">

      ${
        creator.banner
          ? `
            <img
              src="${creator.banner}"
              style="
                width:100%;
                height:260px;
                object-fit:cover;
                border-radius:25px;
              "
            >
          `
          : ""
      }

      <div style="
        margin-top:-55px;
        margin-left:30px;
        position:relative;
      ">

        ${
          creator.avatar
            ? `
              <img
                src="${creator.avatar}"
                style="
                  width:110px;
                  height:110px;
                  border-radius:50%;
                  object-fit:cover;
                  border:5px solid #050505;
                "
              >
            `
            : `
              <div style="
                width:110px;
                height:110px;
                border-radius:50%;
                background:#222;
                border:5px solid #050505;
              "></div>
            `
        }

      </div>

      <h1>
        ${
          creator.display_name ||
          creator.username
        }
      </h1>

      <p style="color:#777">
        @${creator.username}
      </p>

      <p style="
        color:#aaa;
        max-width:650px;
        line-height:1.7;
      ">
        ${creator.bio || ""}
      </p>

      <div style="
        display:flex;
        gap:12px;
        margin:30px 0;
      ">

        ${
          creator.subscription_price_sol > 0
            ? `
              <button
                class="primary"
                onclick="subscribe(
                  ${creator.id},
                  'SOL',
                  ${creator.subscription_price_sol}
                )"
              >
                Subscribe ·
                ${creator.subscription_price_sol}
                SOL
              </button>
            `
            : ""
        }

        ${
          creator.subscription_price_goji > 0
            ? `
              <button
                class="secondary"
                onclick="subscribe(
                  ${creator.id},
                  'GOJI',
                  ${creator.subscription_price_goji}
                )"
              >
                Subscribe ·
                ${creator.subscription_price_goji}
                GOJI
              </button>
            `
            : ""
        }

      </div>

      <div>

        ${data.posts.map(
          post => `

            <article
              style="
                padding:25px;
                margin-bottom:20px;
                background:#0d0d0f;
                border:1px solid rgba(255,255,255,.08);
                border-radius:22px;
              "
            >

              <p>
                ${post.text || ""}
              </p>

              ${
                post.media_url
                  ? `
                    <img
                      src="${post.media_url}"
                      style="
                        width:100%;
                        border-radius:16px;
                        margin-top:15px;
                      "
                    >
                  `
                  : ""
              }

              ${
                post.is_ppv
                  ? `
                    <button
                      class="primary"
                      style="margin-top:15px"
                      onclick="alert('PPV checkout coming next')"
                    >
                      Unlock
                    </button>
                  `
                  : ""
              }

            </article>

          `
        ).join("")}

      </div>

    </div>

  `;
}


async function subscribe(
  creatorId,
  currency,
  amount
) {

  if (!wallet) {

    await connect();

    if (!wallet) return;

  }

  alert(
    `${currency} checkout will be activated in the next payment module.`
  );
}


loadCreator();

</script>

</body>

</html>
